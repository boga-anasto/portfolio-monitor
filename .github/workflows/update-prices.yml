name: Update prices

on:
  schedule:
    - cron: "*/30 2-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil harga
        run: python3 fetch_prices.py
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
